<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Is Your School Segregated?</title>

    <!-- Matches index.css's --color-bg. Without this, Safari infers the
         browser-chrome color from the page itself and can flash a
         mismatched (often darker/default) color during scroll-triggered
         layout shifts near the top/bottom edges — this is the fix for the
         nav-bar-navigation chrome-darkening bug. -->
    <meta name="theme-color" content="#FAF9F6">

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- apple-touch-icon needs a real PNG (traditionally 180x180) — Safari's
         home-screen/bookmark icon system has poor/inconsistent SVG support,
         which is why the favicon shows as a grey globe on mobile even
         though desktop SVG favicons work fine. Swap this back in once
         apple-touch-icon.png exists in /public: -->
    <!-- <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" /> -->
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Omnes via Adobe Fonts -->
    <script>
      (function(d) {
        var config = { kitId: 'wnc5jki', scriptTimeout: 3000, async: true },
        h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s)
      })(document);
    </script>

    <!-- Gaegu via Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Gaegu&display=swap" rel="stylesheet">

    <!-- Kiwi Maru via Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru&display=swap" rel="stylesheet">

  </head>
  <body>
    <div id="root"></div>
    <div id="mobile-overlay" style="display:none; position:fixed; inset:0; z-index:99999; touch-action:none;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
